<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi plan de gym</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15171B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#E7E9ED; --card:#FFFFFF; --ink:#15171B; --mute:#5C6473; --line:#D0D5DC; --line2:#7D8693; --soft:#F0F2F5;
  --btn:#15171B; --btnink:#F4F4F0; --ok:#17703C; --okbg:#E3F2E9; --okink:#FFFFFF; --danger:#B42B24;
  --d0:#0B7A7A; --d0i:#FFFFFF; --d1:#2B6CD4; --d1i:#FFFFFF; --d2:#955F0E; --d2i:#FFFFFF;
  --d3:#B83280; --d3i:#FFFFFF; --d4:#5A6678; --d4i:#FFFFFF;
  --up:var(--ok); --upbg:var(--okbg);
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fn:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --card:#1C1F24; --ink:#F0EFE9; --mute:#98A1AF; --line:#2B3038; --line2:#6F7886; --soft:#262A31;
    --btn:#F0EFE9; --btnink:#14161A; --ok:#4CC486; --okbg:#16301F; --okink:#0E1A12; --danger:#F0736B;
    --d0:#3CC2C2; --d1:#5A93F0; --d2:#E0A93B; --d3:#E276B2; --d4:#9AA4B3;
    --d0i:#0E1114; --d1i:#0E1114; --d2i:#0E1114; --d3i:#0E1114; --d4i:#0E1114;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121417; --card:#1C1F24; --ink:#F0EFE9; --mute:#98A1AF; --line:#2B3038; --line2:#6F7886; --soft:#262A31;
  --btn:#F0EFE9; --btnink:#14161A; --ok:#4CC486; --okbg:#16301F; --okink:#0E1A12; --danger:#F0736B;
  --d0:#3CC2C2; --d1:#5A93F0; --d2:#E0A93B; --d3:#E276B2; --d4:#9AA4B3;
  --d0i:#0E1114; --d1i:#0E1114; --d2i:#0E1114; --d3i:#0E1114; --d4i:#0E1114;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--fb);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:10px 14px 88px}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs .tin{display:flex;max-width:560px;margin:0 auto;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:12px;color:var(--mute);font-size:12.5px;font-weight:600}
.tab.on{color:var(--ink);background:var(--soft)}
.tab.on svg.i{stroke-width:2.7}

/* header + plates */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.wtitle{text-align:center;padding:2px 14px;border-radius:12px}
.wtitle .num{display:block;font-size:36px;font-weight:700;line-height:1}
.wtitle .sub{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.plates{display:flex;justify-content:space-between;gap:6px;padding:4px 0 18px}
.plate{position:relative;flex:1;max-width:64px;aspect-ratio:1;border-radius:50%;border:0;background:conic-gradient(var(--dc) calc(var(--p,0)*1%),color-mix(in srgb,var(--dc) 28%,var(--card)) 0);display:grid;place-items:center;font:600 17px var(--fn);letter-spacing:.02em;color:var(--ink);text-align:center}
.plate::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.plate>span{position:relative}
.plate.done{background:var(--dc);color:var(--dci)}
.plate.done::before{background:var(--dc)}
.plate.skip{background:color-mix(in srgb,var(--line2) 55%,var(--card));color:var(--mute)}
.plate.next{outline:2px solid var(--ink);outline-offset:3px}
.plate.sel::after{content:"";position:absolute;left:50%;bottom:-13px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink)}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 12px}
.dtitle{font:700 30px/1 var(--fn)}
.dblock{color:var(--mute);font-size:15px;margin-top:2px}
.dprog{font-size:26px;font-weight:600;color:var(--mute)}
.chipnext{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--dc);color:var(--dci);font:600 13px var(--fb);vertical-align:middle}

/* exercise cards */
.list{margin:0}
.ex{position:relative;display:block;width:100%;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--dc);border-radius:14px;padding:12px 56px 12px 14px;margin:0 0 10px}
.exname{font-size:19px;font-weight:600;line-height:1.2}
.exobj{margin-left:8px;color:var(--mute);font:600 16px var(--fn);white-space:nowrap}
.exlast,.extoday{display:block;margin-top:4px;font-size:14.5px;color:var(--mute)}
.extoday{color:var(--ink)}
.exlast b,.extoday b{font-weight:600;color:var(--ink)}
.ex.up{background:var(--upbg);border-top-color:var(--up);border-right-color:var(--up);border-bottom-color:var(--up)}
.exup{display:flex;align-items:center;gap:6px;margin-top:7px;font-weight:600;font-size:15.5px;color:var(--up)}
.exup svg.i{width:18px;height:18px;stroke-width:3}
.exup.okk{color:var(--ok)}
.exmark{display:block;margin-top:5px;font-size:13.5px;font-weight:600;color:var(--up)}
.upcount{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--upbg);color:var(--up);border:1.5px solid var(--up);font-weight:600;font-size:14px}
.upbanner{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--upbg);border:2px solid var(--up);color:var(--ink)}
.upbanner b{display:flex;align-items:center;gap:6px;color:var(--up);font-size:18px}
.upbanner.okk{border-color:var(--ok);background:var(--card)}
.upbanner.okk b{color:var(--ok)}
.upbanner span{display:block;margin-top:2px;font-size:15px}
.upbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:22px;border-radius:14px;border:2px dashed var(--up);background:transparent;color:var(--up);font-weight:600;font-size:17px;text-align:center}
.upbtn.on{border-style:solid;background:var(--up);color:var(--btnink)}
.upbtn svg.i{stroke-width:3}
.exnote{display:block;margin-top:7px;font-size:14px;padding:6px 9px;border-radius:8px;background:var(--soft)}
.excheck{position:absolute;right:12px;top:14px;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.excheck svg.i{width:18px;height:18px;stroke-width:3}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:600;font-size:17px;padding:0 18px;margin-top:10px;text-align:center}
.btn.primary{background:var(--btn);color:var(--btnink)}
.btn.line{border:1.5px solid var(--line);background:var(--card)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:44px;font-size:15.5px}
.fin{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-weight:600;color:var(--ok)}
.empty{color:var(--mute);padding:26px 4px;text-align:center}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px)}
.ovin{max-width:560px;margin:0 auto;padding:0 14px 120px}
.ovhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;background:var(--bg)}
.back{display:flex;align-items:center;gap:2px;min-height:48px;padding-right:12px;font-weight:600;font-size:16px}
.ovtitle{font:700 26px var(--fn)}
.count{color:var(--mute);font:600 20px var(--fn)}
.lname{font:700 36px/1.05 var(--fn);margin:4px 0 8px}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--dc);color:var(--dci);font:600 15px var(--fn);letter-spacing:.02em}
.ldate{color:var(--mute);font-size:14px}
.menubtn{margin-left:auto}
.last{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0 18px}
.lasthead{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);margin-bottom:6px}
.lasthead b{color:var(--ink);font-weight:600}
.lastw{font:700 44px/1 var(--fn)}
.lastw small{font:600 18px var(--fb);color:var(--mute);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{min-width:40px;padding:3px 9px;border-radius:10px;background:var(--soft);text-align:center;font:700 22px var(--fn)}
.callout{margin-top:12px;padding:10px 12px;border-left:5px solid var(--dc);background:var(--soft);border-radius:6px 10px 10px 6px;font-size:15.5px}
.tip{margin-top:12px;font-size:15px;color:var(--ok);font-weight:600}
.lastact{display:flex;gap:8px;margin-top:6px}
.lastact .btn{margin-top:8px}
.first{color:var(--mute);font-size:15px}
.sec{font-weight:600;font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{width:120px;height:38px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:15px;text-align:center}
.step{display:flex;align-items:center;gap:8px}
.step>button{flex:0 0 56px;height:56px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center}
.step svg.i{stroke-width:2.8}
.step input{flex:1;min-width:0;width:100%;height:56px;text-align:center;font:700 36px var(--fn);background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.wbox .step>button{flex-basis:66px;height:76px}
.wbox .step input{height:76px;font-size:56px}
.winp{position:relative;flex:1;min-width:0}
.winp span{position:absolute;right:14px;bottom:12px;color:var(--mute);font-weight:600;pointer-events:none}
.hint{color:var(--mute);font-size:13.5px;margin-top:6px}
.sets{margin-top:22px}
.srow{display:grid;grid-template-columns:70px 1fr 50px;align-items:center;gap:8px;margin-bottom:10px}
.slab{font-weight:600;color:var(--mute)}
.kg{height:56px;border-radius:14px;border:1.5px dashed var(--line);color:var(--mute);font-weight:600;text-align:center;display:grid;place-items:center}
.kg.on{border-style:solid;color:var(--ink)}
.swrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:-2px 0 2px 78px}
.swrow input{width:100px;height:46px;text-align:center;font:700 26px var(--fn);border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.setacts{display:flex;gap:8px}
.setacts button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
textarea.note{width:100%;min-height:96px;margin-top:6px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:16px;resize:vertical}
.lbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.lbin{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.lbin .btn{margin:0;width:auto;flex:1}
.lbin .navb{flex:0 0 56px;width:56px;padding:0}
.saved{flex:0 0 auto;font-size:13px;color:var(--mute);min-width:74px;text-align:center}
.saved.on{color:var(--ok);font-weight:600}

/* history */
.search{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:16px}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.seg button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.hname{font-size:18px;font-weight:600;line-height:1.2}
.hlast{grid-column:1;font-size:14.5px;color:var(--ink)}
.hmeta{grid-column:1;font-size:13px;color:var(--mute)}
.hspark{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--ink)}
.spark{width:70px;height:26px}
.trend{font:600 15px var(--fn);color:var(--mute)}
.trend.up{color:var(--ok)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px}
.tile .tv{font:700 27px/1.05 var(--fn)}
.tile .tv small{font:600 14px var(--fb);color:var(--mute);margin-left:3px}
.tile .tl{font-size:12.5px;color:var(--mute);margin-top:2px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 4px;margin-bottom:14px}
.chartbox svg{width:100%;height:auto;display:block}
.ct{fill:var(--mute);font:600 10.5px var(--fb)}
.ctitle{padding:2px 8px 0;font-weight:600;font-size:15px}
.ctitle span{font-weight:400;font-size:13px;color:var(--mute);margin-left:4px}
.cv{fill:var(--ink);font:700 12px var(--fn)}
.sess{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px}
.shead{font-size:13.5px;color:var(--mute)}
.sbody{font-size:17px;font-weight:600;margin-top:2px}
.sbody .num{font-size:22px}
.snote{margin-top:6px;font-size:14.5px;padding:6px 9px;border-radius:8px;background:var(--soft)}

/* weeks */
.wrow{display:grid;grid-template-columns:48px repeat(5,1fr);gap:8px;align-items:center;margin-bottom:8px}
.wrow.head{color:var(--mute);font-size:13px;font-weight:600;text-align:center}
.wlab{font:700 20px var(--fn);color:var(--mute)}
.wlab.cur{color:var(--ink)}
.cell{position:relative;height:44px;width:44px;margin:0 auto;border-radius:50%;border:0;background:conic-gradient(var(--dc) calc(var(--p,0)*1%),color-mix(in srgb,var(--dc) 28%,var(--card)) 0)}
.cell::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.cell.done{background:var(--dc)}
.cell.done::before{background:var(--dc)}
.cell.skip{background:color-mix(in srgb,var(--line2) 55%,var(--card))}
.cell.next{outline:2px solid var(--ink);outline-offset:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13.5px;margin:14px 0 4px}

/* measures */
.wchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.wchips button{flex:0 0 auto;min-width:46px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:700 19px var(--fn);text-align:center;position:relative}
.wchips button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.wchips button.has::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:block}
.fld .fl{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.fld input{width:100%;height:50px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:700 24px var(--fn)}
.fld input[type=date]{font:500 16px var(--fb)}
.fld .fh{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;min-height:17px}
.fld.wide{grid-column:1/-1}
.fld textarea{width:100%;min-height:64px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;font-size:14.5px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);font-size:12.5px}
th:first-child,td:first-child{text-align:left;font-weight:600}
tr:last-child td{border-bottom:0}
details.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
details.how summary{font-weight:600;cursor:pointer;min-height:24px}
details.how p{margin-top:8px;font-size:14.5px;color:var(--mute)}
details.how p b{color:var(--ink)}

/* data */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{color:var(--mute);font-size:14.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.ok{background:var(--ok)}
.dot.err{background:var(--danger)}
.page-h{font:700 32px/1.05 var(--fn);margin:6px 0 12px}

/* sheet + modal */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:700 24px var(--fn);margin-bottom:10px}
.menu button{display:flex;align-items:center;width:100%;min-height:52px;border-bottom:1px solid var(--line);font-size:17px;font-weight:500}
.menu button:last-child{border-bottom:0}
.menu .dz{color:var(--danger)}
.plist{margin-top:8px}
.plist button{display:block;width:100%;min-height:50px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px}
.plist button.new{font-weight:600}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:15px}
.chk input{width:22px;height:22px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
.mcard{width:100%;max-width:420px;background:var(--card);border-radius:18px;padding:18px}
.mcard h3{font:700 24px var(--fn);margin-bottom:6px}
.mcard p{color:var(--mute);font-size:15px;margin-bottom:10px}
.minput{width:100%;height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px;margin-top:4px}
.mact{display:flex;gap:8px;margin-top:14px}
.mact button{flex:1;min-height:48px;border-radius:12px;font-weight:600;text-align:center}
.mact .ghost{border:1.5px solid var(--line)}
.mact .primary{background:var(--btn);color:var(--btnink)}
.mact .danger{background:var(--danger);color:#fff}
textarea.copybox{width:100%;height:200px;font:13px monospace;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);padding:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center;font-weight:600}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ---- v2: correcciones de UX ---- */
[tabindex="-1"]:focus{outline:none}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mute) 80%,var(--card));opacity:1}
.step input::placeholder{color:color-mix(in srgb,var(--mute) 80%,var(--card));opacity:1;font-style:italic}
.search,.tag,.step input,.step>button,.swrow input,textarea.note,.fld input,.fld textarea,.minput,.setacts button,.btn.line,.wchips button,.seg button,.fchips button,.tg,.mact .ghost,textarea.copybox{border-color:var(--line2)}
.pill,.chipnext{background:transparent;color:var(--ink);border:2px solid var(--dc)}
.chipnext{padding:0 9px}
.excheck{border-color:var(--line2)}
.excheck.full{background:var(--dc);border-color:var(--dc);color:var(--dci)}
.excheck.part{width:auto;min-width:42px;padding:0 7px;border-radius:16px;right:10px;border-color:var(--dc);color:var(--ink);font-size:15px}
.lname{font-size:32px;margin:2px 0 6px}
.last{padding:12px;margin:10px 0 14px}
.lastrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lastw{font-size:38px}
.chips{margin-top:0}
.lastact{margin-top:2px}
.sets{margin-top:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tg{min-height:36px;padding:0 12px;border:1.5px solid var(--line2);border-radius:999px;background:var(--card);font-size:14.5px;font-weight:600;text-align:center}
.tg.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.tags .tag{width:96px;height:36px;border-radius:999px;font-size:14.5px}
.tgl{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:14px;font-weight:600;color:var(--mute)}
.tgl::before{content:"";flex:none;width:34px;height:20px;border-radius:999px;background:radial-gradient(circle at 10px 50%,#fff 7px,transparent 7.5px),var(--line2)}
.tgl.on{color:var(--ink)}
.tgl.on::before{background:radial-gradient(circle at 24px 50%,#fff 7px,transparent 7.5px),var(--ok)}
.srow{grid-template-columns:58px 1fr 52px}
.step>button{flex-basis:52px}
.wbox .step>button{flex-basis:66px}
.sck{width:52px;height:56px;border-radius:14px;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--mute);background:var(--card)}
.sck svg{width:22px;height:22px;stroke-width:3}
.sck.on{background:var(--ok);border-color:var(--ok);color:var(--okink)}
.swrow{margin:-2px 0 2px 66px}
.setacts button{display:flex;align-items:center;justify-content:center;gap:6px;padding:0;text-align:center}
.setacts svg.i{width:20px;height:20px}
.lbin .saved{flex:1}
.rest{position:relative;overflow:hidden;flex:1;min-height:56px;border-radius:14px;background:var(--soft);border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:6px;font-weight:600;text-align:left}
.rest[hidden]{display:none}
.rest .rb{position:absolute;left:0;top:0;bottom:0;width:100%;background:color-mix(in srgb,var(--ok) 30%,transparent)}
.rest>span:not(.rb){position:relative}
.rest .rt{font:700 26px var(--fn)}
.rest>span:nth-child(2){font-size:13px;font-weight:600}
.lbin .btn.primary{flex:0 0 auto;padding:0 16px}
.remind{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--soft);border:1.5px solid var(--line2);margin:0 0 10px;font-size:14.5px}
.remind span{flex:1}
.remind button{min-height:44px;padding:0 12px;border-radius:10px;font-weight:600;text-align:center}
.remind .x{width:44px;padding:0;display:grid;place-items:center}
.remind .x svg{transform:rotate(45deg)}
.fchips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0;padding-bottom:2px;scrollbar-width:none}
.fchips button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);font-weight:600;font-size:14.5px;text-align:center}
.fchips button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.hup{color:var(--ok);font-weight:600}
.scap{font-size:11.5px;color:var(--mute)}
.gh{font:700 19px var(--fn);margin:20px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 8px 8px;font-size:12.5px;color:var(--mute)}
.legend2 i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-line{width:16px;height:0;border-top:2.5px solid var(--ink)}
.lg-bar{width:7px;height:14px;border-radius:4px;background:var(--mute);opacity:.5}
.lg-zone{width:16px;height:12px;border-radius:3px;background:var(--soft);border:1px solid var(--line2)}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 8px 8px;scrollbar-width:none}
.mchips button{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);font-size:14px;font-weight:600;text-align:center}
.mchips button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:6px}
.sumcard h3{font:700 22px var(--fn)}
.sumcard .tiles{margin:8px 0 4px}
.sumcard p{font-size:14.5px;margin-top:4px}
.sumcard p b{color:var(--ok)}
.wrow{grid-template-columns:52px repeat(5,1fr);padding:3px 0}
.wrow.head{position:sticky;top:60px;z-index:2;background:var(--bg);padding:4px 0}
.wrow.cur{background:var(--soft);border-radius:14px}
.wlab small{display:block;font:500 11px var(--fb);color:var(--mute)}
.legend{align-items:center}
.legend .cell{display:inline-block;vertical-align:middle;width:18px;height:18px;margin:0 6px 0 0}
.legend .cell::before{inset:3px}
.legend span{display:inline-flex;align-items:center}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast .tundo{font-weight:700;text-decoration:underline;padding:6px 4px;min-height:36px;color:inherit}
.mact button:disabled{opacity:.4;cursor:not-allowed}
/* ---- balanza ---- */
.scact{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.scact .btn{flex:1 1 150px;margin:0}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.fld.rev input{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--card))}
.fld.rev .fh{color:var(--danger);font-weight:600}
.fld.calc input{border-style:dashed}
.sacts{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.sacts .btn{margin-top:8px}
.sacts .btn:first-child{margin-top:0}
.slast .tiles{margin:10px 0 0}
body:has(#sheet) #toast,body:has(.modal) #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.sbody.s2{font-size:15px}
.sbody.s2 .num{font-size:19px}
</style>
</head>

/* ---------- plan migrations (run once per dataset, safe on old saved data) ---------- */
var MIG=4;
function migrate(st){
  var v=st.mig||1; if(v>=MIG) return false;
  if(v<2) migrate2(st);
  if(v<3) migrate3(st);
  if(v<4) migrate4(st);
  st.mig=MIG; return true;
}
function migrate2(st){
  var N=st.names||(st.names={}), used={};
  Object.keys(st.days).forEach(function(k){
    var day=st.days[k], out=[];
    day.ex.forEach(function(e){
      if(e.id==='hip-thrust'){
        if(day.d===2) e.id='hip-thrust-miercoles'; else if(day.d===4) e.id='hip-thrust-viernes';
      } else if(e.id==='dominadas-jalon'){
        e.id='dominadas'; if(e.w===0 && !e.tag) e.w=null;
      } else if(e.id==='bulgarian-split-squat' && day.wk>=5 && !hasData(e)){
        if(day.ex.some(function(x){ return x.id==='peso-rumano'; })) return; /* ya estaba Peso rumano: se quita el Bulgarian */
        e.id='peso-rumano'; e.obj='3x5-8';
      }
      out.push(e);
    });
    day.ex=out;
    out.forEach(function(e){ used[e.id]=1; });
  });
  if(used['hip-thrust-miercoles']) N['hip-thrust-miercoles']='Hip thrust (miércoles)';
  if(used['hip-thrust-viernes']) N['hip-thrust-viernes']='Hip thrust (viernes)';
  if(used['dominadas']) N['dominadas']='Dominadas';
  if(used['peso-rumano'] && !N['peso-rumano']) N['peso-rumano']='Peso rumano';
  ['hip-thrust','dominadas-jalon'].forEach(function(id){ if(!used[id]) delete N[id]; });
}
/* v3: ejercicios que se repiten en dos días de la misma semana con distinta cantidad de series */
var SPLITS={
  'curl-femoral':{2:['curl-femoral-miercoles','Curl femoral (miércoles)'],4:['curl-femoral-viernes','Curl femoral (viernes)']},
  'extension-de-cuadriceps':{0:['extension-de-cuadriceps-lunes','Extensión de cuádriceps (lunes)'],4:['extension-de-cuadriceps-viernes','Extensión de cuádriceps (viernes)']}
};
/* v4: los datos de la semana 1 se guardan pero no cuentan en historial ni estadísticas */
function migrate4(st){ if(!st.settings) st.settings={step:2.5}; st.settings.skip=[1]; }
function migrate3(st){
  var N=st.names||(st.names={}), used={};
  Object.keys(st.days).forEach(function(k){
    var day=st.days[k];
    day.ex.forEach(function(e){
      var m=SPLITS[e.id]; if(m&&m[day.d]) e.id=m[day.d][0];
      used[e.id]=1;
    });
  });
  Object.keys(SPLITS).forEach(function(old){
    Object.keys(SPLITS[old]).forEach(function(d){ var r=SPLITS[old][d]; if(used[r[0]]) N[r[0]]=r[1]; });
    if(!used[old]) delete N[old];
  });
}

function seq(){ var a=[]; for(var w=1;w<=S.nweeks;w++) for(var d=0;d<5;d++) a.push(w+'-'+d); return a; }
function idxOf(k){ var p=k.split('-'); return (+p[0]-1)*5+(+p[1]); }
function hasData(e){ return !!(e && ((e.sets||[]).some(function(s){return s.r!=null;}) || (e.note&&String(e.note).trim()))); }
function dayHasData(day){ return !!day && day.ex.some(hasData); }
function dayComplete(day){ return !!day && (day.fin || (day.ex.length>0 && day.ex.every(hasData))); }
function cursor(){
  var s=seq(), last=-1;
  s.forEach(function(k,i){ var dd=S.days[k]; if(dayHasData(dd)||(dd&&dd.fin)) last=i; });
  if(last<0) return 0;
  return dayComplete(S.days[s[last]]) ? Math.min(last+1,s.length-1) : last;
}
function dayState(k){
  var dd=S.days[k]; if(!dd) return '';
  var cs=cursor();
  if(dayComplete(dd)) return 'done';
  if(dayHasData(dd)) return 'part';
  if(idxOf(k)<cs) return 'skip';
  if(idxOf(k)===cs) return 'next';
  return '';
}
function commit(){ S.updatedAt=Date.now(); saveLocal(); queuePush(); flashSaved(); }

/* ---------- exercise helpers ---------- */
function exName(id){ return S.names[id]||id; }
function parseObj(o){ var m=String(o||'').match(/^\s*(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*$/i); if(!m) return null; return {n:+m[1],min:+m[2],max:m[3]?+m[3]:+m[2]}; }
function objTxt(o){ var r=parseObj(o); if(!r) return o||''; return r.min===r.max ? r.n+' × '+r.min : r.n+' × '+r.min+'–'+r.max; }
function setsOf(e){ return (e.sets||[]).filter(function(s){return s.r!=null;}); }
function wtxt(e){ return e.w==null ? 'Peso corporal' : fn(e.w)+' kg'+(e.tag?' '+e.tag:''); }
function repsTxt(e){ return setsOf(e).map(function(s){ return (s.w!=null && s.w!==e.w) ? s.r+'@'+fn(s.w) : String(s.r); }).join(' · '); }
function sumReps(e){ return setsOf(e).reduce(function(a,s){return a+s.r;},0); }
function topW(e){ var v=[]; if(e.w!=null) v.push(e.w); (e.sets||[]).forEach(function(s){ if(s.w!=null) v.push(s.w); }); return v.length?Math.max.apply(null,v):null; }
function skipped(wk){ var sk=(S.settings&&S.settings.skip)||[]; return sk.indexOf(wk)>=0; }
function histOf(id,all){
  var out=[]; seq().forEach(function(k){ var day=S.days[k]; if(!day) return; if(!all&&skipped(day.wk)) return; day.ex.forEach(function(e,i){ if(e.id===id && hasData(e)) out.push({k:k,wk:day.wk,d:day.d,date:day.date,e:e,i:i}); }); });
  return out;
}
function prevOf(id,k){ var idx=idxOf(k), res=null; histOf(id).forEach(function(h){ if(idxOf(h.k)<idx) res=h; }); return res; }
function prevFlag(id,k){
  var idx=idxOf(k), dd=+k.split('-')[1], res=null; /* mismo ejercicio, mismo día de la semana anterior */
  seq().forEach(function(kk){ if(idxOf(kk)>=idx) return; var day=S.days[kk]; if(!day||day.d!==dd) return; day.ex.forEach(function(e,i){ if(e.id===id&&(hasData(e)||e.up)) res={k:kk,wk:day.wk,d:day.d,date:day.date,e:e,i:i}; }); });
  return (res&&res.e.up)?res:null;
}
function upBase(pf){ var w=pf.e.w; if(w==null){ var p=prevOf(pf.e.id,pf.k); w=p&&p.e.w!=null?p.e.w:null; } return w; }
function upTarget(pf){ var w=upBase(pf); return w==null?null:Math.round((w+(S.settings.step||2.5))*100)/100; }
function upDone(e,pf){ var b=upBase(pf); return hasData(e)&&b!=null&&e.w!=null&&e.w>b; }
function upLine(e,pf){ if(upDone(e,pf)) return 'Subiste a '+fn(e.w)+' kg'; var t=upTarget(pf); return t!=null?'Subir peso · probá '+fn(t)+' kg':'Subir peso o dificultad'; }
function upBannerHTML(e,pf){
  if(!pf) return ''; var okk=upDone(e,pf);

/* ---------- capas (botón Atrás de Android) ---------- */
var L=[], sent=false, skipPop=0, recT=null;
function reconcile(){
  clearTimeout(recT);
  recT=setTimeout(function(){
    var want=L.length>0;
    try{
      if(want&&!sent){ history.pushState({gym:1},''); sent=true; }
      else if(!want&&sent){ skipPop++; sent=false; history.back(); }
    }catch(e){}
  },0);
}
function layerPush(f){ L.push(f); reconcile(); }
function layerDrop(f){ var i=L.lastIndexOf(f); if(i>=0) L.splice(i,1); reconcile(); }
function closeTop(){ var f=L.pop(); if(f) f(false); reconcile(); }
function closeAllLayers(){ while(L.length){ L.pop()(true); } reconcile(); }
window.addEventListener('popstate',function(){
  if(skipPop>0){ skipPop--; return; }
  sent=false; var f=L.pop(); if(f) f(false); reconcile();
});
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&L.length){ ev.preventDefault(); closeTop(); } });

/* ---------- vibración, sonido, pantalla encendida, descanso ---------- */
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
var AC=null;
function unlockAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(){
  try{ unlockAudio(); if(!AC) return;
    [0,0.3].forEach(function(dl){ var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+dl; o.frequency.value=880; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.24); o.start(t); o.stop(t+0.26); });
  }catch(e){}
}
var wl=null;
async function wakeOn(){ try{ if(navigator.wakeLock&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',function(){ wl=null; }); } }catch(e){ wl=null; } }
function wakeOff(){ try{ if(wl) wl.release(); }catch(e){} wl=null; }

var rest={t:null,end:0,total:0};
function restSecs(){ return S.settings.rest==null?90:S.settings.rest; }
function startRest(){ var s=restSecs(); if(!s) return; unlockAudio(); rest.total=s; rest.end=Date.now()+s*1000; clearInterval(rest.t); rest.t=setInterval(tickRest,250); tickRest(); }
function stopRest(){ clearInterval(rest.t); rest.t=null; rest.end=0; paintRest(); }
function tickRest(){
  if(!rest.end) return;
  var left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){ rest.end=0; clearInterval(rest.t); rest.t=null; paintRest(); buzz([220,100,220]); beep(); toast('Terminó el descanso'); return; }
  paintRest(left);
}

  if(!rest.end){ el.hidden=true; var sv=document.getElementById('saved'); if(sv) sv.hidden=false; return; }
  el.hidden=false; var sv2=document.getElementById('saved'); if(sv2) sv2.hidden=true;
  if(left==null) left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  el.querySelector('.rt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');

function niceTicks(mn,mx,cnt){

  if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  TW=await Tesseract.createWorker('eng',1,{logger:function(m){ if(setMsg&&m&&m.status==='recognizing text') setMsg('Leyendo el texto… '+Math.round((m.progress||0)*100)+' %'); else if(setMsg&&m&&/load|init/.test(m.status||'')) setMsg('Preparando el lector de texto (solo la primera vez)…'); }});
  await TW.setParameters({tessedit_pageseg_mode:'11'});
  return TW;
}
function wordsOf(data){ return (data.words||[]).map(function(w){ return {text:w.text,x0:w.bbox.x0,y0:w.bbox.y0,x1:w.bbox.x1,y1:w.bbox.y1,conf:w.confidence}; }); }

/* encabezado: texto gris tenue sobre fondo oscuro -> estira el contraste local y lo agranda */
function headerCanvas(orig){
  var W=orig.width, hh=Math.min(orig.height,Math.round(W*0.3)), c=document.createElement('canvas'); c.width=W*2; c.height=hh*2;
  var x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingQuality='high'; x.drawImage(orig,0,0,W,hh,0,0,W*2,hh*2);
  var im=x.getImageData(0,0,c.width,c.height), d=im.data, i, hist=new Array(256).fill(0), n=0;
  for(i=0;i<d.length;i+=4){ var g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]); hist[g]++; n++; }
  var acc=0, bg=0; for(i=0;i<256;i++){ acc+=hist[i]; if(acc>=n/2){ bg=i; break; } }
  var dark=bg<128;
  for(i=0;i<d.length;i+=4){ var l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2], v=dark?(l-bg)*5:(bg-l)*5; v=Math.max(0,Math.min(255,v)); d[i]=d[i+1]=d[i+2]=255-v; }
  x.putImageData(im,0,0); return c;
}
async function readWithOCR(file,setMsg){
  var cv=await prepCanvas(file), wk;
  try{ wk=await getWorker(setMsg); }catch(e){ TW=null; throw new Error('noocr'); }
  var W=cv.proc.width, H=cv.proc.height, words=[], TILE=2200, OV=240;
  if(H<=TILE*1.15){ words=wordsOf((await wk.recognize(cv.proc)).data); }
  else {
    for(var y0=0,k=0;y0<H;k++){
      var y1=Math.min(H,y0+TILE), last=y1>=H, tc=document.createElement('canvas'); tc.width=W; tc.height=y1-y0; tc.getContext('2d').drawImage(cv.proc,0,y0,W,y1-y0,0,0,W,y1-y0);
      if(setMsg) setMsg('Leyendo el texto… parte '+(k+1));
      var lo=y0+(k>0?OV/2:0), hi=y1-(last?0:OV/2);
      wordsOf((await wk.recognize(tc)).data).forEach(function(w){ var cy=y0+(w.y0+w.y1)/2; if(cy>=lo&&cy<hi){ w.y0+=y0; w.y1+=y0; words.push(w); } });
      if(last) break; y0=y1-OV;
    }
  }
  if(!words.length) throw new Error('empty');
  var out=ocrParse(words,W,H,heightHint());
  if(!out.date||!out.time){
    try{
      var hc=headerCanvas(cv.orig); await wk.setParameters({tessedit_pageseg_mode:'6'});
      var t=(await wk.recognize(hc)).data.text||'';
      var dm=t.match(/\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{4}|\d{4}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{1,2}/), tm=t.match(/\b\d{1,2}\s*:\s*\d{2}\b/);
      if(!out.date&&dm) out.date=parseDateAny(dm[0].replace(/\s+/g,''),out.english?'mdy':'dmy'); if(!out.time&&tm) out.time=parseTimeAny(tm[0].replace(/\s+/g,''));
    }catch(e){} finally{ try{ await wk.setParameters({tessedit_pageseg_mode:'11'}); }catch(e){} }
  }
  return out;
}
async function readWithClaude(file){

  }
  var keys=SF.map(function(f){ return f[0]+' ('+f[1]+(f[2]?', '+f[2]:'')+')'; }).join('; ');
  var prompt='Las imágenes son partes consecutivas, de arriba hacia abajo y con un pequeño solapamiento, de UNA captura de la app de una balanza de composición corporal. Extraé solo los valores que se ven escritos. Respondé únicamente con un objeto JSON con estas claves, cada una un número (punto decimal) o null si no aparece: '+keys+'. Además: fecha (texto exacto de la fecha de la medición, por ejemplo "09/28/2026"), hora ("HH:MM") e idioma ("en" o "es", según el idioma de la app). "peso" es el número grande de arriba. No incluyas flechas de variación ni los valores de "peso estándar" o sugerencias. No inventes valores.';
  var o=await sample.json(prompt,{images:blobs,modelTier:'default'});

  var vals={}; SF.forEach(function(f){ var v=o[f[0]]; v=typeof v==='string'?num(v):v; if(typeof v==='number'&&isFinite(v)) vals[f[0]]=v; });
  var fin=finalizeScale(vals,{});
  return {date:parseDateAny(o.fecha,o.idioma==='en'?'mdy':'dmy'),time:parseTimeAny(o.hora),vals:fin.vals,flags:fin.flags,viaClaude:true};
}

/* ---------- cloud sync (db capability) ---------- */
var cloud=null, pushing=false, dirty=false, pushT=null;
function queuePush(){ if(!cloud) return; dirty=true; clearTimeout(pushT); pushT=setTimeout(doPush,1500); }
async function doPush(){
  if(!cloud||!dirty) return;
  if(pushing){ pushT=setTimeout(doPush,800); return; }
  pushing=true; dirty=false; setSync('syncing');
  try{ await cloud.set({payload:JSON.stringify(S),updatedAt:S.updatedAt}); setSync(dirty?'syncing':'ok'); }
  catch(e){ dirty=false; setSync('error'); }
  pushing=false; if(dirty) pushT=setTimeout(doPush,800);
}
async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use)) return;
    var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    var db=res[0], user=res[1]; if(!db||!user) return;
    var uid=await user.id(); if(!uid) return;
    var ref=db.doc('data/users/'+uid+'/gym');
    var snap=await ref.get(), remote=snap.exists?snap.data():null;
    cloud=ref;
    if(remote&&remote.payload&&(remote.updatedAt||0)>(S.updatedAt||0)){
      var o=JSON.parse(remote.payload);
      if(o&&o.v===1&&o.days){ S=o; S.updatedAt=remote.updatedAt; if(!S.settings) S.settings={step:2.5}; if(!S.meas) S.meas={}; if(migrate(S)){ S.updatedAt=Date.now(); queuePush(); } saveLocal(); refreshTop(); }
      setSync('ok');
    } else if((S.updatedAt||0)>((remote&&remote.updatedAt)||0)){ queuePush(); }
    else setSync('ok');
  }catch(e){ cloud=null; }
}

function csvCell(v){ v=String(v==null?'':v); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(){
  var maxS=4; seq().forEach(function(k){ var d=S.days[k]; if(d) d.ex.forEach(function(e){ maxS=Math.max(maxS,setsOf(e).length); }); });
  var head=['Semana','Día','Bloque','Ejercicio','Objetivo','Peso (kg)']; for(var i=1;i<=maxS;i++) head.push('Serie '+i); head.push('Notas','Fecha','Subir peso');
  var rows=[head];
  seq().forEach(function(k){ var d=S.days[k]; if(!d) return; d.ex.forEach(function(e){
    var sets=setsOf(e), r=['Semana '+d.wk,DAYN[d.d],d.block||'',exName(e.id),e.obj||'',e.w==null?'':fn(e.w)+(e.tag?' '+e.tag:'')];
    for(var i=0;i<maxS;i++){ var s=sets[i]; r.push(s? ((s.w!=null&&s.w!==e.w)? s.r+' c '+fn(s.w) : s.r) : ''); }
    r.push(e.note||'',d.date||'',e.up?'sí':''); rows.push(r);
  }); });
  return '\uFEFF'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');
}

  var data=custom?custom.data:(kind==='json'?JSON.stringify(S,null,1):toCSV()), name=custom?custom.name:'entrenamiento-'+todayISO()+'.'+kind;
  try{
    var dl=await getDL();
    if(!dl){ markBackup(kind); try{ var bl=new Blob([data],{type:kind==='json'?'application/json':'text/csv;charset=utf-8'}), u=URL.createObjectURL(bl), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },4000); toast('Archivo descargado'); return; }catch(e2){} openSheet('<h3>Copiá el contenido</h3><p class="hint">Este navegador no permite descargar desde acá. Copiá el texto y pegalo en un archivo.</p><textarea class="copybox" readonly id="cpy"></textarea>'); var t=document.getElementById('cpy'); t.value=data; t.focus(); t.select(); return; }
    await dl.save({filename:name,data:data}); markBackup(kind); toast('Archivo guardado');
